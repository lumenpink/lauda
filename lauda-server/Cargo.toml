[package]
name = "lauda-server"
version = "0.6.0-dev.13+20261111.0d51388"
edition = "2024"
authors = ["Lumen <lumen@2lp.in>"]
description = "Micro-daemon HTTP gateway e ponte Dovecot/Postfix para o ecossistema Lauda"
license = "GPL-3.0"

[dependencies]
lauda-types = { path = "../lauda-types" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
jsonwebtoken = "9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"
mail-parser = "0.11"
chrono = "0.4"
tokio-stream = { version = "0.1", features = ["sync"] }
rusqlite = { version = "0.33", features = ["bundled"] }
base64 = "0.22"
html2text = "0.12"
lauda-index = { path = "../lauda-index" }
urupema = { version = "0.1.2", registry = "gambi" }
notify = "8.0"

[dev-dependencies]
base64 = "0.22"
chrono = "0.4"
futures-util = "0.3"
http-body-util = "0.1"
lauda-client = { path = "../lauda-client" }
minijinja = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tempfile = "3.10"
tokio-tungstenite = "0.29"
urupema = { version = "0.1.2", registry = "gambi" }


[lints]
workspace = true
