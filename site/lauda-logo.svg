<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Textura Halftone Pontilhada -->
    <pattern id="halftone" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.8" fill="#0a0a0a" opacity="0.15" />
      <circle cx="12" cy="12" r="1.8" fill="#0a0a0a" opacity="0.15" />
    </pattern>

    <clipPath id="rounded-icon">
      <rect width="512" height="512" rx="108" />
    </clipPath>
  </defs>

  <g clip-path="url(#rounded-icon)">
    <!-- Fundo do Ícone: Papel Envelhecido / Off-White -->
    <rect width="512" height="512" fill="#f4efe6" />
    <rect width="512" height="512" fill="url(#halftone)" />

    <!-- Faixas Diagonais Vermelhas Trash Polka -->
    <polygon points="290,0 420,0 190,512 60,512" fill="#dc143c" />
    <polygon points="435,0 470,0 240,512 205,512" fill="#8b0000" opacity="0.85" />

    <!-- Carimbo Circular Trash Polka -->
    <circle cx="140" cy="140" r="56" fill="none" stroke="#dc143c" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.75" />
    <text x="140" y="145" font-family="monospace" font-weight="bold" font-size="12" fill="#dc143c" text-anchor="middle" letter-spacing="3" opacity="0.85">2LP // SMOL</text>

    <!-- Envelope Brutalista Central -->
    <g>
      <!-- Sombra Dura Vetorial Fiel -->
      <rect x="108" y="172" width="320" height="220" rx="4" fill="#0a0a0a" />

      <!-- Base do Envelope -->
      <rect x="96" y="160" width="320" height="220" rx="4" fill="#ffffff" stroke="#0a0a0a" stroke-width="10" stroke-linejoin="miter" />

      <!-- Linhas do Envelope em Linha Grossa -->
      <path d="M96 160 L256 295 L416 160" fill="none" stroke="#0a0a0a" stroke-width="10" stroke-linecap="square" stroke-linejoin="miter" />
      <path d="M96 380 L216 270" fill="none" stroke="#0a0a0a" stroke-width="8" stroke-linecap="square" />
      <path d="M416 380 L296 270" fill="none" stroke="#0a0a0a" stroke-width="8" stroke-linecap="square" />

      <!-- Lacre / Selo Central com Tipografia L -->
      <polygon points="256,180 282,204 230,204" fill="#dc143c" stroke="#0a0a0a" stroke-width="3" />
      <rect x="230" y="204" width="52" height="56" fill="#0a0a0a" />
      <text x="256" y="246" font-family="monospace" font-weight="900" font-size="36" fill="#ffffff" text-anchor="middle">L</text>
    </g>

    <!-- Rótulo / Tarja Inferior: LAUDA -->
    <g transform="translate(256, 436)">
      <rect x="-115" y="-22" width="230" height="42" fill="#0a0a0a" />
      <text x="0" y="8" font-family="monospace" font-weight="900" font-size="24" fill="#f4efe6" text-anchor="middle" letter-spacing="6">LAUDA</text>
    </g>
  </g>

  <!-- Moldura Externa Contínua -->
  <rect x="8" y="8" width="496" height="496" rx="100" fill="none" stroke="#0a0a0a" stroke-width="12" />
</svg>
