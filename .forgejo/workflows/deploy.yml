name: "Deploy"

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  deploy-site:
    name: "Deploy Documentation Site & APK (GOST-CI Deploy)"
    runs-on: ubuntu-latest
    container:
      image: codeberg.org/lumenpink/gost-ci-deploy:latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
      - name: "Deploy to Cloudflare Workers"
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            wrangler deploy
          else
            echo "CLOUDFLARE_API_TOKEN not set, skipping Cloudflare deploy."
          fi
      - name: "Deploy to Codeberg Pages (Fallback)"
        uses: https://codeberg.org/actions/pages@v1
        with:
          path: site
