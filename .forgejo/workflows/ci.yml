name: "CI / CD Pipeline"

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:

jobs:
  test:
    name: "Rust Test, Lint & E2E (GOST-CI)"
    runs-on: ubuntu-latest
    container:
      image: codeberg.org/lumenpink/gost-ci-gui:latest
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
      - name: "Checkout sibling dependencies"
        run: |
          mkdir -p ../../ishcondidim ../../papeli ../../urupema
          git clone --depth 1 https://codeberg.org/lumenpink/ishcondidim.git ../../ishcondidim || true
          git clone --depth 1 https://codeberg.org/lumenpink/papeli.git ../../papeli || true
          git clone --depth 1 https://codeberg.org/lumenpink/urupema.git ../../urupema || true
      - name: "Format Check"
        run: cargo fmt -- --check
      - name: "Clippy (Zero Warnings)"
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: "Run All Tests & E2E Suites"
        run: cargo test --all-targets --all-features

  deploy-site:
    name: "Deploy Documentation Site & APK (GOST-CI Deploy)"
    runs-on: ubuntu-latest
    container:
      image: codeberg.org/lumenpink/gost-ci-deploy:latest
    needs: [test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
      - name: "Deploy to Cloudflare Workers"
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            wrangler deploy
          else
            echo "CLOUDFLARE_API_TOKEN not set, skipping Cloudflare deploy."
          fi
      - name: "Deploy to Codeberg Pages (Fallback)"
        uses: https://codeberg.org/actions/pages@v1
        with:
          path: site
