name: "CI / CD Pipeline"

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:

jobs:
  test:
    name: "Rust Test, Lint & E2E (GOST-CI)"
    runs-on: ubuntu-latest
    container:
      image: docker.io/lumenpink/gost-ci-wasm:latest
    steps:
      - name: "Install Node.js Runtime for Runner Actions"
        run: |
          if ! command -v node >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq --no-install-recommends nodejs >/dev/null
          fi
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
      - name: "Checkout sibling dependencies"
        run: |
          mkdir -p ../ishcondidim ../papeli ../urupema
          if [ -d /opt/gost/deps/ishcondidim ]; then
            ln -sf /opt/gost/deps/* ../ 2>/dev/null || true
          fi
          if [ ! -f ../ishcondidim/Cargo.toml ]; then
            git clone --depth 1 https://codeberg.org/lumenpink/ishcondidim.git ../ishcondidim
          fi
          if [ ! -f ../papeli/Cargo.toml ]; then
            git clone --depth 1 https://codeberg.org/lumenpink/papeli.git ../papeli
          fi
          if [ ! -f ../urupema/Cargo.toml ]; then
            git clone --depth 1 https://codeberg.org/lumenpink/urupema.git ../urupema
          fi
      - name: "Sync Version Manifests"
        run: ./scripts/sync-version-manifests.sh
      - name: "Format Check"
        run: cargo fmt -- --check
      - name: "Clippy (Zero Warnings)"
        run: cargo clippy --workspace -- -D warnings
      - name: "Run All Tests & E2E Suites"
        run: cargo test --workspace
      - name: "Audit Sovereign CD Workflow"
        run: bash tests/audit_cd_workflow.sh

  deploy-web:
    name: "Build Dioxus WebAssembly & Deploy to Cloudflare"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    container:
      image: docker.io/lumenpink/gost-ci-wasm:latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
      - name: "Checkout sibling dependencies"
        run: |
          mkdir -p ../ishcondidim ../papeli ../urupema
          if [ -d /opt/gost/deps/ishcondidim ]; then
            ln -sf /opt/gost/deps/* ../ 2>/dev/null || true
          fi
          if [ ! -f ../ishcondidim/Cargo.toml ]; then
            git clone --depth 1 https://codeberg.org/lumenpink/ishcondidim.git ../ishcondidim
          fi
          if [ ! -f ../papeli/Cargo.toml ]; then
            git clone --depth 1 https://codeberg.org/lumenpink/papeli.git ../papeli
          fi
          if [ ! -f ../urupema/Cargo.toml ]; then
            git clone --depth 1 https://codeberg.org/lumenpink/urupema.git ../urupema
          fi
      - name: "Sync Version Manifests"
        run: ./scripts/sync-version-manifests.sh
      - name: "Build Dioxus Web Client (Release)"
        run: |
          dx build -p lauda-client --platform web --release
          rm -rf site/app/assets/*
          cp -r target/dx/lauda-client/release/web/public/assets/* site/app/assets/
          JS_NAME=$(ls site/app/assets | grep '^lauda-client-.*\.js$' | head -n 1)
          WASM_NAME=$(ls site/app/assets | grep '^lauda-client_bg-.*\.wasm$' | head -n 1)
          sed -i -E "s|/app/assets/lauda-client-[^\"']+\.js|/app/assets/${JS_NAME}|g" site/app/index.html
          sed -i -E "s|/app/assets/lauda-client_bg-[^\"']+\.wasm|/app/assets/${WASM_NAME}|g" site/app/index.html
      - name: "Ensure Sovereign Keystore Signature on APKs"
        run: |
          if [ -f "$HOME/.android/in_twolp_release.keystore" ] && [ -f "$HOME/.android/in_twolp_release.properties" ]; then
            echo "✅ Keystore soberana oficial detectada em $HOME/.android/"
            if [ -f site/lauda-latest.apk ] && [ -f scripts/sign-release.sh ]; then
              ./scripts/sign-release.sh site/lauda-latest.apk || true
            fi
            if [ -f site/lauda-nightly.apk ] && [ -f scripts/sign-release.sh ]; then
              ./scripts/sign-release.sh site/lauda-nightly.apk || true
            fi
          else
            echo "Aviso: Keystore soberana não montada em ~/.android; mantendo assinatura existente."
          fi
          if command -v apksigner >/dev/null 2>&1; then
            echo "Verificando assinaturas dos APKs em site/:"
            apksigner verify --print-certs site/lauda-latest.apk || true
          fi
      - name: "Deploy to Cloudflare Workers"
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            wrangler deploy
          else
            echo "CLOUDFLARE_API_TOKEN not set, skipping Cloudflare deploy."
          fi
      - name: "Deploy to Codeberg Pages (Fallback)"
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ -d site ]; then
            git config user.name "actions-user"
            git config user.email "actions@codeberg.org"

            WORKTREE_DIR=$(mktemp -d)
            if git ls-remote --exit-code --heads origin pages >/dev/null 2>&1; then
              git fetch origin pages:pages
              git worktree add "$WORKTREE_DIR" pages
            else
              git worktree add --orphan -b pages "$WORKTREE_DIR"
            fi

            rm -rf "${WORKTREE_DIR:?}"/*
            cp -r site/* "$WORKTREE_DIR/"

            cd "$WORKTREE_DIR"
            git add -A
            if git diff --staged --quiet; then
              echo "No changes to deploy to Codeberg Pages."
            else
              git commit -m "docs(site): deploy to Codeberg Pages [skip ci]"
              git push origin pages
              echo "Successfully deployed to Codeberg Pages."
            fi
            cd - >/dev/null
            git worktree remove "$WORKTREE_DIR" --force || true
          fi

  deploy-desktop:
    name: "Build Desktop Client (Linux Release)"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    container:
      image: docker.io/lumenpink/gost-ci-wasm:latest
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
      - name: "Checkout sibling dependencies"
        run: |
          mkdir -p ../ishcondidim ../papeli ../urupema
          if [ -d /opt/gost/deps/ishcondidim ]; then
            ln -sf /opt/gost/deps/* ../ 2>/dev/null || true
          fi
          if [ ! -f ../ishcondidim/Cargo.toml ]; then
            git clone --depth 1 https://codeberg.org/lumenpink/ishcondidim.git ../ishcondidim
          fi
          if [ ! -f ../papeli/Cargo.toml ]; then
            git clone --depth 1 https://codeberg.org/lumenpink/papeli.git ../papeli
          fi
          if [ ! -f ../urupema/Cargo.toml ]; then
            git clone --depth 1 https://codeberg.org/lumenpink/urupema.git ../urupema
          fi
      - name: "Build Desktop Binary"
        run: |
          cargo build -p lauda-client --features desktop --release
          mkdir -p dist/desktop
          cp target/release/lauda-client dist/desktop/lauda-desktop

      - name: "Publish Native Desktop & CLI to Banca Storage"
        run: |
          echo "★ Publicando binário nativo do Lauda na Banca (banca.2lp.in/downloads/lauda)..."
          if [ -d /srv/banca/downloads/lauda ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              TAG="${GITHUB_REF#refs/tags/v}"
              mkdir -p /srv/banca/downloads/lauda/stable-latest /srv/banca/downloads/lauda/releases/v$TAG
              cp dist/desktop/lauda-desktop /srv/banca/downloads/lauda/releases/v$TAG/lauda
              cp dist/desktop/lauda-desktop /srv/banca/downloads/lauda/stable-latest/lauda
              echo "$TAG" > /srv/banca/downloads/lauda/version
            else
              mkdir -p /srv/banca/downloads/lauda/nightly-latest
              cp dist/desktop/lauda-desktop /srv/banca/downloads/lauda/nightly-latest/lauda
              git rev-parse --short HEAD > /srv/banca/downloads/lauda/nightly-version
            fi
          fi
          echo "✔ Binário do Lauda entregue na Banca."

  deploy-apk:
    name: "Build Android APK & Sync Pratilera"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
      - name: "Sync Version Manifests"
        run: ./scripts/sync-version-manifests.sh
      - name: "Package Android APK & Sign Soberano"
        run: |
          ./scripts/package-all.sh --apk || true
          if [ -f scripts/sign-release.sh ]; then
            [ -f site/lauda.apk ] && ./scripts/sign-release.sh site/lauda.apk || true
            [ -f site/lauda-latest.apk ] && ./scripts/sign-release.sh site/lauda-latest.apk || true
          fi
      - name: "Sync with Pratilera"
        run: |
          ./scripts/package-all.sh --sync-pratilera || true
      - name: "Upload APKs to Cloudflare R2"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            if [ -f site/lauda.apk ]; then
              npx wrangler r2 object put "twolp-bucket/lauda.apk" --file="site/lauda.apk" --remote || true
              npx wrangler r2 object put "twolp-bucket/lauda-latest.apk" --file="site/lauda.apk" --remote || true
            elif [ -f site/lauda-latest.apk ]; then
              npx wrangler r2 object put "twolp-bucket/lauda.apk" --file="site/lauda-latest.apk" --remote || true
              npx wrangler r2 object put "twolp-bucket/lauda-latest.apk" --file="site/lauda-latest.apk" --remote || true
            fi
          else
            echo "Cloudflare token ausente ou APK ausente, mantendo distribuição estática."
          fi
  trigger-pratilera:
    name: "Trigger Pratilera Store Update"
    runs-on: ubuntu-latest
    needs: [deploy-apk]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: "Trigger Pratilera Workflow Dispatch"
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          if [ -n "$CODEBERG_TOKEN" ]; then
            echo "-> Notificando a Pratilera (Banca) para atualizar o catálogo..."
            curl -s -X POST \
              -H "Authorization: token $CODEBERG_TOKEN" \
              -H "Content-Type: application/json" \
              "https://codeberg.org/api/v1/repos/lumenpink/banca/actions/workflows/ci.yml/dispatches" \
              -d '{"ref": "main"}' || true
          else
            echo "CODEBERG_TOKEN ausente, pulando disparo remoto da Pratilera."
          fi

  deploy-server:
    name: "Container — Build & Sovereign CD (obizero)"
    runs-on: ubuntu-latest
    needs: [test]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4

      - name: "Build local Docker Image"
        run: |
          OLD_IMAGE_ID=$(docker inspect --format='{{.Id}}' lumenpink/lauda-server:latest 2>/dev/null || true)
          echo "OLD_IMAGE_ID=$OLD_IMAGE_ID" >> $GITHUB_ENV
          docker build -t lumenpink/lauda-server:latest -f ./Dockerfile .

      - name: "Login to Docker Hub (Registry Backup)"
        if: env.DOCKER_PASSWORD != ''
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: "Push Image to Docker Hub (Registry Backup)"
        if: env.DOCKER_PASSWORD != ''
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          docker push lumenpink/lauda-server:latest

      - name: "Deploy Locally on obizero (Direct Socket)"
        run: |
          echo "-> Aplicando atualização local no runtime Docker do obizero..."
          docker compose -f /home/lumen/stacks/mail/compose.yml up -d --no-build lauda-server

      - name: "Active Healthcheck & Rollback Protocol"
        run: |
          echo "-> Sondando estabilidade do container lauda-server (polling 15s)..."
          SUCCESS=0
          for i in $(seq 1 15); do
            STATUS=$(docker inspect --format='{{.State.Status}}' lauda-server 2>/dev/null || echo "unknown")
            if [ "$STATUS" = "running" ]; then
              echo "  [PASS] Container lauda-server saudável e ativo (tentativa $i/15)."
              SUCCESS=1
              break
            fi
            sleep 1
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "✘ [FALHA] Container lauda-server não estabilizou! Acionando Rollback..."
            if [ -n "$OLD_IMAGE_ID" ]; then
              docker tag "$OLD_IMAGE_ID" lumenpink/lauda-server:latest
              docker compose -f /home/lumen/stacks/mail/compose.yml up -d --no-build lauda-server
              echo "✔ Rollback concluído no obizero."
            fi
            exit 1
          fi

      - name: "Prune Orphan Docker Layers"
        run: |
          docker image prune -f
