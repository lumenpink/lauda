name: "CI / CD Pipeline"

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:

jobs:
  test:
    name: "Rust Test & Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Install Rust Toolchain"
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: "Format Check"
        run: cargo fmt -- --check
      - name: "Clippy (Zero Warnings)"
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: "Run Tests"
        run: cargo test --all-targets --all-features

  build-artifacts:
    name: "Build Release Binaries & APK"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: "Install Rust Toolchain"
        uses: dtolnay/rust-toolchain@stable
      - name: "Install Build Tools"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev aapt zipalign apksigner
      - name: "Compile Server & Desktop Binaries"
        run: |
          mkdir -p dist
          cargo build --release -p lauda-server
          cargo build --release -p lauda-client --features desktop
          cp target/release/lauda-server dist/lauda-server-linux-x86_64
          cp target/release/lauda-client dist/lauda-desktop-linux-x86_64
          chmod +x dist/*
      - name: "Package Android APK"
        run: |
          if [ -f site/lauda-latest.apk ]; then
            cp site/lauda-latest.apk dist/lauda-latest.apk
          fi
          cd dist
          sha256sum * > checksums.sha256
      - name: "Upload Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: lauda-dist
          path: dist/*

  deploy-site:
    name: "Deploy Documentation Site & APK"
    runs-on: ubuntu-latest
    needs: [build-artifacts]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: "Download Artifacts"
        uses: actions/download-artifact@v4
        with:
          name: lauda-dist
          path: dist
      - name: "Sync APK to Site"
        run: |
          if [ -f dist/lauda-latest.apk ]; then
            cp dist/lauda-latest.apk site/lauda-latest.apk
          fi
      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: "Deploy to Cloudflare Workers"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx wrangler deploy
          else
            echo "CLOUDFLARE_API_TOKEN not set, skipping Cloudflare deploy."
          fi
      - name: "Deploy to Codeberg Pages (Fallback)"
        uses: https://codeberg.org/actions/pages@v1
        with:
          path: site

  publish-releases:
    name: "Publish Release & Nightly"
    runs-on: ubuntu-latest
    needs: [build-artifacts]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: "Download Artifacts"
        uses: actions/download-artifact@v4
        with:
          name: lauda-dist
          path: dist
      - name: "Publish Rolling Nightly Release (Branch main)"
        if: github.ref == 'refs/heads/main'
        uses: https://github.com/softprops/action-gh-release@v2
        with:
          tag_name: "nightly"
          name: "Lauda Nightly Build"
          body: "Build contínuo de desenvolvimento do ramo principal (${{ github.sha }}). Rastreável automaticamente pelo Obtainium."
          prerelease: true
          files: |
            dist/*
      - name: "Publish Tagged Release"
        if: startsWith(github.ref, 'refs/tags/v')
        uses: https://github.com/softprops/action-gh-release@v2
        with:
          name: "Lauda ${{ github.ref_name }}"
          body: "Lançamento oficial da versão ${{ github.ref_name }} do Lauda Smolclient."
          prerelease: false
          files: |
            dist/*
