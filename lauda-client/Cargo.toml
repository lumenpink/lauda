[package]
name = "lauda-client"
version = "0.2.0"
edition = "2024"
authors = ["Lumen <lumen@2lp.in>"]
description = "Smolclient minimalista em Dioxus para leitura em texto puro e redação rápida"
license = "GPL-3.0"

[dependencies]
lauda-types = { path = "../lauda-types" }
lauda-index = { path = "../lauda-index" }
dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "signals", "hooks", "launch", "document"] }
pulldown-cmark = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
tempfile = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.33", features = ["bundled"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage", "Location", "History", "console"] }
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
rexie = "0.6.2"

[features]
default = []
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[lints]
workspace = true
