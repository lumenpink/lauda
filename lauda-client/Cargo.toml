[package]
name = "lauda-client"
version = "0.1.0"
edition = "2021"
authors = ["Lumen <lumen@2lp.in>"]
description = "Smolclient minimalista em Dioxus para leitura em texto puro e redação rápida"
license = "GPL-3.0"

[dependencies]
lauda-types = { path = "../lauda-types" }
dioxus = { version = "0.6", default-features = false, features = ["macro", "html", "signals", "hooks", "launch"] }
pulldown-cmark = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }


[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[features]
default = []
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[lints]
workspace = true
